# Sito statico (distribuzione wasmJs) + proxy verso RFI e Trenord sulla stessa origine.
# Le stesse rotte del dev server: composeApp/webpack.config.d/proxy.js.

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types application/wasm application/javascript text/css application/json;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Pagina e script hanno nomi fissi: vanno sempre riconvalidati dopo un nuovo deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location ~* \.(js|css)$ {
        add_header Cache-Control "no-cache";
    }

    # I .wasm hanno l'hash nel nome; il tipo giusto serve a WebAssembly.instantiateStreaming.
    location ~* \.wasm$ {
        types { }
        default_type application/wasm;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Lo User-Agent di un browser desktop, come i client su desktop e Android: dal browser non
    # si può impostare. Niente cookie in nessuna direzione.
    set $board_user_agent "Mozilla/5.0 (Macintosh; Intel Mac OS X 10.15; rv:157.0) Gecko/20100101 Firefox/157.0";

    location /rfi/ {
        proxy_pass https://iechub.rfi.it/;
        proxy_ssl_server_name on;
        proxy_set_header Host iechub.rfi.it;
        proxy_set_header User-Agent $board_user_agent;
        proxy_set_header Accept-Language it;
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        proxy_read_timeout 30s;
    }

    location /trenord/ {
        proxy_pass https://www.trenord.it/;
        proxy_ssl_server_name on;
        proxy_set_header Host www.trenord.it;
        proxy_set_header User-Agent $board_user_agent;
        proxy_set_header Accept-Language it;
        proxy_set_header Cookie "";
        proxy_set_header Origin "";
        proxy_set_header Referer "";
        proxy_hide_header Set-Cookie;
        # station-details può impiegare più di 20 s (il client aspetta fino a 45 s).
        proxy_read_timeout 60s;
    }
}
