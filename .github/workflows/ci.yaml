name: 'CI'
on:
  push:
    branches:
    - 'main'
  pull_request: {}
jobs:
  check_yaml_consistency:
    name: 'Check YAML consistency'
    runs-on: 'ubuntu-latest'
    steps:
    - id: 'step-0'
      name: 'Check out'
      uses: 'actions/checkout@v7'
    - id: 'step-1'
      name: 'Execute script'
      run: 'rm ''.github/workflows/ci.yaml'' && ''.github/workflows/ci.main.kts'''
    - id: 'step-2'
      name: 'Consistency check'
      run: 'git diff --exit-code ''.github/workflows/ci.yaml'''
  build:
    name: 'Test e build'
    runs-on: 'ubuntu-latest'
    needs:
    - 'check_yaml_consistency'
    steps:
    - id: 'step-0'
      name: 'Checkout'
      uses: 'actions/checkout@v7'
    - id: 'step-1'
      name: 'Java 21'
      uses: 'actions/setup-java@v6'
      with:
        java-version: '21'
        distribution: 'temurin'
    - id: 'step-2'
      name: 'Gradle'
      uses: 'gradle/actions/setup-gradle@v6'
    - id: 'step-3'
      name: 'Test'
      run: './gradlew :composeApp:jvmTest :wearApp:testDebugUnitTest'
    - id: 'step-4'
      name: 'Build'
      run: './gradlew :androidApp:assembleRelease :wearApp:assembleRelease :composeApp:packageUniversalJar :composeApp:wasmJsBrowserDistribution'
  docker:
    name: 'Immagine Docker'
    runs-on: 'ubuntu-latest'
    needs:
    - 'check_yaml_consistency'
    steps:
    - id: 'step-0'
      name: 'Buildx'
      uses: 'docker/setup-buildx-action@v4'
    - id: 'step-1'
      name: 'Build'
      uses: 'docker/build-push-action@v7'
      with:
        cache-from: 'type=gha'
        cache-to: 'type=gha,mode=max'
        push: 'false'
