# This file was generated using Kotlin DSL (.github/workflows/release.main.kts).
# If you want to modify the workflow, please change the Kotlin file and regenerate this YAML file.
# Generated with https://github.com/typesafegithub/github-workflows-kt

name: 'Release'
on:
  push:
    tags:
    - 'v*'
permissions:
  contents: 'read'
jobs:
  check_yaml_consistency:
    name: 'Check YAML consistency'
    runs-on: 'ubuntu-latest'
    steps:
    - id: 'step-0'
      name: 'Check out'
      uses: 'actions/checkout@v7'
    - id: 'step-1'
      name: 'Execute script'
      run: 'rm ''.github/workflows/release.yaml'' && ''.github/workflows/release.main.kts'''
    - id: 'step-2'
      name: 'Consistency check'
      run: 'git diff --exit-code ''.github/workflows/release.yaml'''
  version:
    name: 'Versione'
    runs-on: 'ubuntu-latest'
    needs:
    - 'check_yaml_consistency'
    outputs:
      version: '${{ steps.step-1.outputs.version }}'
      prerelease: '${{ steps.step-1.outputs.prerelease }}'
    steps:
    - id: 'step-0'
      name: 'Checkout'
      uses: 'actions/checkout@v7'
    - id: 'step-1'
      name: 'Controllo tag'
      run: |-
        VERSION="${GITHUB_REF_NAME#v}"
        APP_VERSION=$(sed -nE 's/^app-version = "(.*)"$/\1/p' gradle/libs.versions.toml)
        if [ "${VERSION%%-*}" != "$APP_VERSION" ]; then
          echo "::error::Il tag $GITHUB_REF_NAME non corrisponde ad app-version $APP_VERSION (gradle/libs.versions.toml)"
          exit 1
        fi
        case "$VERSION" in *-*) PRERELEASE=true ;; *) PRERELEASE=false ;; esac
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
  android:
    name: 'APK Android'
    runs-on: 'ubuntu-latest'
    needs:
    - 'version'
    - 'check_yaml_consistency'
    steps:
    - id: 'step-0'
      name: 'Checkout'
      uses: 'actions/checkout@v7'
    - id: 'step-1'
      name: 'Java 21'
      uses: 'actions/setup-java@v6'
      with:
        java-version: '21'
        distribution: 'temurin'
    - id: 'step-2'
      name: 'Gradle'
      uses: 'gradle/actions/setup-gradle@v6'
    - id: 'step-3'
      name: 'Keystore'
      env:
        KEYSTORE_BASE64: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}'
        KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}'
        KEY_ALIAS: '${{ secrets.ANDROID_KEY_ALIAS }}'
        KEY_PASSWORD: '${{ secrets.ANDROID_KEY_PASSWORD }}'
      run: |-
        mkdir -p signing
        echo "$KEYSTORE_BASE64" | base64 --decode > signing/release.jks
        {
          echo "storeFile=release.jks"
          echo "storePassword=$KEYSTORE_PASSWORD"
          echo "keyAlias=$KEY_ALIAS"
          echo "keyPassword=$KEY_PASSWORD"
        } > signing/credential.properties
    - id: 'step-4'
      name: 'Build'
      run: './gradlew :androidApp:assembleRelease :wearApp:assembleRelease'
    - id: 'step-5'
      name: 'APK'
      env:
        VERSION: '${{ needs.version.outputs.version }}'
      run: |-
        APK=androidApp/build/outputs/apk/release/androidApp-release.apk
        WEAR=wearApp/build/outputs/apk/release/wearApp-release.apk
        if [ ! -f "$APK" ] || [ ! -f "$WEAR" ]; then
          echo "::error::Manca l'APK firmato: controlla i secret ANDROID_*"
          exit 1
        fi
        mv "$APK" "Tabellone-$VERSION.apk"
        mv "$WEAR" "Tabellone-Wear-$VERSION.apk"
    - id: 'step-6'
      name: 'Upload'
      uses: 'actions/upload-artifact@v7'
      with:
        name: 'android'
        path: 'Tabellone-*.apk'
  desktop:
    name: 'Jar desktop'
    runs-on: 'ubuntu-latest'
    needs:
    - 'version'
    - 'check_yaml_consistency'
    steps:
    - id: 'step-0'
      name: 'Checkout'
      uses: 'actions/checkout@v7'
    - id: 'step-1'
      name: 'Java 21'
      uses: 'actions/setup-java@v6'
      with:
        java-version: '21'
        distribution: 'temurin'
    - id: 'step-2'
      name: 'Gradle'
      uses: 'gradle/actions/setup-gradle@v6'
    - id: 'step-3'
      name: 'Build'
      run: './gradlew :composeApp:packageUniversalJar'
    - id: 'step-4'
      name: 'Upload'
      uses: 'actions/upload-artifact@v7'
      with:
        name: 'desktop'
        path: 'composeApp/build/dist/DepartureBoard-*.jar'
  docker:
    name: 'Immagine Docker'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'read'
      packages: 'write'
      attestations: 'write'
      id-token: 'write'
    needs:
    - 'version'
    - 'check_yaml_consistency'
    steps:
    - id: 'step-0'
      name: 'Nome immagine'
      run: 'echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"'
    - id: 'step-1'
      name: 'Login'
      uses: 'docker/login-action@v4'
      with:
        registry: 'ghcr.io'
        username: '${{ github.actor }}'
        password: '${{ secrets.GITHUB_TOKEN }}'
    - id: 'step-2'
      name: 'Metadata'
      uses: 'docker/metadata-action@v6'
      with:
        images: '${{ steps.step-0.outputs.name }}'
        tags: |-
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
    - id: 'step-3'
      name: 'QEMU'
      uses: 'docker/setup-qemu-action@v4'
    - id: 'step-4'
      name: 'Buildx'
      uses: 'docker/setup-buildx-action@v4'
    - id: 'step-5'
      name: 'Build e push'
      uses: 'docker/build-push-action@v7'
      with:
        cache-from: 'type=gha'
        cache-to: 'type=gha,mode=max'
        labels: '${{ steps.step-2.outputs.labels }}'
        platforms: 'linux/amd64,linux/arm64'
        push: 'true'
        tags: '${{ steps.step-2.outputs.tags }}'
    - id: 'step-6'
      name: 'Attestazione'
      uses: 'actions/attest-build-provenance@v4'
      with:
        subject-digest: '${{ steps.step-5.outputs.digest }}'
        subject-name: '${{ steps.step-0.outputs.name }}'
        push-to-registry: 'true'
  release:
    name: 'GitHub Release'
    runs-on: 'ubuntu-latest'
    permissions:
      contents: 'write'
    needs:
    - 'version'
    - 'android'
    - 'desktop'
    - 'check_yaml_consistency'
    steps:
    - id: 'step-0'
      name: 'Download'
      uses: 'actions/download-artifact@v8'
      with:
        path: 'dist'
        merge-multiple: 'true'
    - id: 'step-1'
      name: 'Release'
      uses: 'softprops/action-gh-release@v3'
      with:
        prerelease: '${{ needs.version.outputs.prerelease }}'
        files: 'dist/*'
        generate_release_notes: 'true'
